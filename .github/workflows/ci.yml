name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    env:
      CHRONOSYNC_DB__DSN: postgresql+asyncpg://chrono:chrono@localhost:5432/chronosync_test
      CHRONOSYNC_VAULT_KEY: ci-vault-key-not-for-prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy chronosync
        continue-on-error: true  # informational until type debt cleared

      - name: Unit tests
        run: pytest -m unit -v

  functional:
    name: Functional tests (TimescaleDB)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: chrono
          POSTGRES_PASSWORD: chrono
          POSTGRES_DB: chronosync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chrono -d chronosync_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHRONOSYNC_DB__DSN: postgresql+asyncpg://chrono:chrono@localhost:5432/chronosync_test
      CHRONOSYNC_VAULT_KEY: ci-vault-key-not-for-prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Functional tests
        # The conftest reuses the existing DB instead of starting a testcontainer
        # when one is already reachable; CHRONOSYNC_DB__DSN points at the service.
        run: pytest -m functional -v
