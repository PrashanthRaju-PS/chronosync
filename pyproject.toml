[project]
name = "chronosync"
version = "0.1.0"
description = "Provider-agnostic historical price-volume database daemon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Prashanth Raju" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=8.5",
    "structlog>=24.1",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=43.0",
    "keyring>=25.2",
    "python-dateutil>=2.9",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
client = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "freezegun>=1.5",
]

[project.scripts]
chronosync = "chronosync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronosync", "chronosync_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas_market_calendars.*", "vcr.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "functional: integration tests requiring docker",
    "requires_docker: tests that spin up containers",
    "requires_network: tests that hit live HTTP",
]
