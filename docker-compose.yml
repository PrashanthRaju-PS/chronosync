# Full-stack compose: DB + migrate + daemon + api all run in Docker.
# All non-DB services read .env but override the DB DSN so they reach the DB
# over the compose network (the .env DSN uses localhost, which is correct only
# for bare-metal runs on the host).
x-db-env: &db-env
  CHRONOSYNC_DB__DSN: "postgresql+asyncpg://chrono:chrono@timescaledb:5432/chronosync"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: chronosync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chrono
      POSTGRES_PASSWORD: chrono
      POSTGRES_DB: chronosync
    ports:
      - "5432:5432"
    volumes:
      - chronosync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chrono -d chronosync"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    container_name: chronosync-migrate
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *db-env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  daemon:
    build: .
    container_name: chronosync-daemon
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      <<: *db-env
    volumes:
      - chronosync_vault:/var/lib/chronosync
    command: ["uv", "run", "chronosync", "run"]
    restart: unless-stopped

  api:
    build: .
    container_name: chronosync-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      <<: *db-env
    # Bound to loopback on the host (the scanner connects to 127.0.0.1:8088);
    # 0.0.0.0 inside the container so uvicorn accepts the forwarded connection.
    ports:
      - "127.0.0.1:8088:8088"
    command: ["uv", "run", "uvicorn", "chronosync.api.app:app", "--host", "0.0.0.0", "--port", "8088"]
    restart: unless-stopped

volumes:
  chronosync_pgdata:
  chronosync_vault:
